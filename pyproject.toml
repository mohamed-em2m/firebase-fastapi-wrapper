[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "firebase-fastapi-wrapper"
version = "0.2.0"
description = "Run FastAPI apps inside Firebase Functions with full HTTP forwarding"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Emam" }]
keywords = ["fastapi", "firebase", "firebase-functions", "asgi", "wrapper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110.0",
    "starlette>=1.0.0",
    "firebase-functions>=0.2.0",
    "httpx>=0.27.0",       # required by Starlette TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pre-commit>=4.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage      = "https://github.com/Mohamed-Em2m/FastApi-with-Firebase-functions"
Repository    = "https://github.com/Mohamed-Em2m/FastApi-with-Firebase-functions"
"Bug Tracker" = "https://github.com/Mohamed-Em2m/FastApi-with-Firebase-functions/issues"
Changelog     = "https://github.com/Mohamed-Em2m/FastApi-with-Firebase-functions/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["firebase_fastapi_wrapper*"]

[tool.setuptools.package-data]
firebase_fastapi_wrapper = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select  = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore  = ["E501"]  # line length enforced by formatter
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
log_cli      = true
log_cli_level = "INFO"

[tool.coverage.run]
source = ["firebase_fastapi_wrapper"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
