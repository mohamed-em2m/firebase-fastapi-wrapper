name: "Pre-commit checks"

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pre-commit:
    name: "Run pre-commit hooks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: uv run pre-commit run --all-files
